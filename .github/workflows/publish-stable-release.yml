name: Publish verified stable updater release
on:
  push:
    branches: [main]
    paths: [.github/stable-release.json, .github/stable-release-retry.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stable-updater-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify publication parser and resume fixtures
        shell: pwsh
        run: node --test .github/scripts/tests/publish-stable-release.test.cjs
      - name: Check Studio package and handoff regressions before publishing
        if: github.repository == 'Priestkiller/Enshrouded-Mod-Studio'
        shell: pwsh
        run: |
          node tests/production-package-handoff-tests.js
          if ($LASTEXITCODE) { throw 'Studio production handoff regression failed' }
          node tests/build-contract-tests.js
          if ($LASTEXITCODE) { throw 'Unsupported-build regression failed' }
          node tests/native-item-textures-tests.js
          if ($LASTEXITCODE) { throw 'New item texture completeness regression failed' }
          node tests/night-plants-tests.js
          if ($LASTEXITCODE) { throw 'Studio knowledge composition regression failed' }
          node tests/producer-consumer-matrix.js
          if ($LASTEXITCODE) { throw 'Studio create/export output differs from the independently consumer-certified contract' }
      - name: Read the current public Studio producer for Manager compatibility
        if: github.repository == 'Priestkiller/Universal-Game-Server-Manager'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Priestkiller/Enshrouded-Mod-Studio
          ref: main
          path: .compat/studio
          persist-credentials: false
      - name: Prepare Go for the production compatibility check
        if: github.repository == 'Priestkiller/Universal-Game-Server-Manager'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Require a matching Studio, Manager and embedded Player worker
        if: github.repository == 'Priestkiller/Universal-Game-Server-Manager'
        shell: pwsh
        run: |
          ./scripts/verify-studio-release-contract.ps1 -StudioRoot .compat/studio -AllowMissingVendorRuntime -RestoreSourceEMM
          node .compat/studio/tests/production-package-handoff-tests.js
          if ($LASTEXITCODE) { throw 'Studio production handoff regression failed' }
          node .compat/studio/tests/native-item-textures-tests.js
          if ($LASTEXITCODE) { throw 'New item texture completeness regression failed' }
          node .compat/studio/tests/night-plants-tests.js
          if ($LASTEXITCODE) { throw 'Studio knowledge composition regression failed' }
          go test ./internal/player -run '^TestEMSStudio(34|35|36|37)|^TestEMSNativeItemTexture' -count=1
          if ($LASTEXITCODE) { throw 'Manager and Player feature composition regression failed' }
      - name: Verify exact chunks and publish stable latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: '1'
        run: node .github/scripts/publish-stable-release.cjs .github/stable-release.json
